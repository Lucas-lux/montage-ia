name: tests

on:
  push:
    branches: [main, refonte-timeline]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-14
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Les tests marqués `ffmpeg` sont sautés quand ffmpeg est absent.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # celui de Homebrew n'a ni libass (sous-titres) ni vorbis : on prend le
      # même ffmpeg statique que l'application Mac
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          for t in ffmpeg ffprobe; do
            curl -fsSL -A "montage-ia-ci" -o "$RUNNER_TEMP/$t.zip" \
              "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$t.zip"
            unzip -o -q "$RUNNER_TEMP/$t.zip" -d "$RUNNER_TEMP/ffmpeg"
          done
          chmod +x "$RUNNER_TEMP/ffmpeg/"*
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
