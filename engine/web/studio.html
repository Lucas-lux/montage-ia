<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio · Montage IA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23F23A52%22/%3E%3Cpath d=%22M11 9v14l11-7z%22 fill=%22%23fff%22/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/web/studio/studio.css" />
<script>
  // Thème choisi (sombre par défaut), posé avant le premier rendu : pas de flash.
  try { if (localStorage.getItem("montage.theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="mark" title="Montage IA">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="currentColor"><path d="M6 4v12l10-6z"/></svg>
    </div>
    <a class="rbtn" id="navProjects" href="/" title="Projets"></a>
    <a class="rbtn on" id="navStudio" title="Montage"></a>
    <a class="rbtn" id="navTools" href="/#tools" title="Boîte à outils"></a>
    <div class="spacer"></div>
    <button class="rbtn" id="navTheme" title="Thème clair / sombre"></button>
  </nav>

  <div class="main">
    <header class="topbar">
      <a class="btn icon quiet" id="back" href="/" title="Projets"></a>
      <input class="titlein" id="name" spellcheck="false" aria-label="Nom du montage" />
      <span class="savestate" id="saveState"></span>
      <div class="grow"></div>
      <span class="stat" id="stDur"></span>
      <span class="stat" id="stFormat"></span>
      <span class="vsep"></span>
      <button class="btn icon quiet" id="undo" title="Annuler (Ctrl+Z)"></button>
      <button class="btn icon quiet" id="redo" title="Rétablir (Ctrl+Y)"></button>
      <span class="vsep"></span>
      <button class="btn primary" id="exportBtn"></button>
    </header>

    <div class="work" id="work">
      <!-- gauche : médias, texte, sous-titres -->
      <section class="panel" id="left">
        <div class="tabs" id="leftTabs">
          <button class="tab on" data-tab="media" data-icon="grid"><span>Médias</span></button>
          <button class="tab" data-tab="text" data-icon="text"><span>Texte</span></button>
          <button class="tab" data-tab="captions" data-icon="cc"><span>Sous-titres</span></button>
          <button class="tab" data-tab="sounds" data-icon="note"><span>Sons</span></button>
          <button class="tab" data-tab="auto" data-icon="wand"><span>Outils IA</span></button>
        </div>
        <div class="pb" id="tab-media"></div>
        <div class="pb hidden" id="tab-text"></div>
        <div class="pb hidden" id="tab-captions"></div>
        <div class="pb hidden" id="tab-sounds"></div>
        <div class="pb hidden" id="tab-auto"></div>
      </section>

      <!-- centre : lecteur -->
      <section class="panel" id="player">
        <div class="viewer" id="viewer">
          <div class="stage" id="stage">
            <div class="vlayer" id="vlayer"></div>
            <div class="handles" id="handles"></div>
            <div class="ghosts" id="ghosts"></div>
            <div class="caplayer" id="caplayer"></div>
            <div class="guide v hidden" id="guideV"></div>
            <div class="guide h hidden" id="guideH"></div>
            <div class="empty" id="stageEmpty">Importe des médias puis glisse-les sur la timeline.</div>
          </div>
        </div>
        <div class="transport">
          <span class="tcode" id="tcode"></span>
          <div class="grow"></div>
          <button class="btn icon quiet" id="tStart" title="Début (Origine)"></button>
          <button class="btn icon quiet" id="tStepB" title="Image précédente (←)"></button>
          <button class="playbtn" id="tPlay" title="Lecture / pause (Espace)"></button>
          <button class="btn icon quiet" id="tStepF" title="Image suivante (→)"></button>
          <button class="btn icon quiet" id="tEnd" title="Fin (Fin)"></button>
          <div class="grow"></div>
          <button class="btn icon quiet" id="tLoop" title="Lecture en boucle"></button>
          <select id="fmtSel" title="Format du projet" style="width:auto;height:26px"></select>
          <button class="btn icon quiet" id="tFull" title="Plein écran"></button>
        </div>
      </section>

      <!-- droite : inspecteur -->
      <section class="panel" id="right">
        <div class="ph"><h2 id="inspTitle">Projet</h2></div>
        <div class="pb insp" id="insp"></div>
      </section>
    </div>

    <div class="splitter" id="splitter" title="Glisser pour agrandir la timeline"></div>

    <!-- bas : timeline -->
    <section class="panel tl" id="tl">
      <div class="tltools" id="tltools"></div>
      <div class="tlscroll" id="tlscroll">
        <div class="tlinner" id="tlinner"></div>
      </div>
    </section>
  </div>
</div>

<script type="module" src="/web/studio/main.js"></script>
</body>
</html>
